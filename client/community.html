<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackLayer – Community</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/components/navbar.css" />
    <link rel="stylesheet" href="css/components/pages/community.css" />
   
  </head>
  <body>
    <div class="community-main">
      <div id="toast" class="toast"></div>
      <div class="community-badge">
        <a class="nav-logo" href="/">
          <div class="nav-logo-icon">
            <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M4 6h16M4 12h16M4 18h10"
                stroke="#fff"
                stroke-width="2.5"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </div>
          StackLayer
        </a>
      </div>

      <h1 class="community-title">
        The community for people<br />
        <span>building with AI</span>
      </h1>

      <p class="community-desc">
        StackLayer maps AI tools to real workflows. The Community is where
        practitioners share what's working, ask what isn't, and help each other
        move faster. No noise. Just people doing the work.
      </p>

      <div class="waitlist-wrap" id="waitlistWrap">
        <input
          class="waitlist-input"
          type="email"
          id="emailInput"
          placeholder="Enter your email address"
        />
        <button class="waitlist-btn" onclick="joinWaitlist()">
          Join the Waitlist
        </button>
      </div>
      <p class="waitlist-note" id="waitlistNote"></p>

      <div class="community-img-wrap">
        <img src="assets/images/image.png" class="image-waitlist" alt="img" />
      </div>
    </div>

    <script src="./js/pages/landing.js"></script>
    <script>
              const toast = document.querySelector("#toast");
              const input = document.getElementById("emailInput");

        const showToast = (msg, type = "success") => {
            toast.classList.remove("loading")
            toast.classList.remove("error")
            toast.style.opacity = "0"
            toast.textContent = msg;
            if (type === "loading") {
                toast.classList.add("loading");
            }
             if (type === "error"){
                toast.classList.add("error");
            }
          toast.style.transform = "translateY(0)"
          toast.style.opacity = "1"
          if(type === "error"){
              setTimeout(() => (toast.style.opacity = "0"), 3500);
          }
          if(type === "success") {
                setTimeout(() => (toast.style.opacity = "0"), 8000)
          }
        }

        input.addEventListener("keydown", () => {
             input.style.borderColor = "#e2e8f0";
        })

      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbytnV4G3eeX0NMb3zgdklnV65zXLajwnd8dIrstpjMWJ3oKslENMiC_hRom1bCudPzs5w/exec";
      function joinWaitlist() {
        showToast("Sending email...", "loading");
       
        const email = input.value.trim();
        if (!email || !email.includes("@")) {
          input.style.borderColor = "#ef4444";
          input.focus();
          showToast("Please enter a valid email address!", "error");
          return;
        }

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ email }),
        })
          .then(async (res) => res.json())
          .then(async (data) => {
            if (!data.success) {
              input.style.borderColor = "#ef4444";
              input.focus();
              showToast("Something went wrong, try again!", "error")
            }
            showToast("You' now on the list. We'll reach out when Community launches!")
          })
          .catch((err) => showToast("Failed to send email", "error"));
      }
      document.getElementById("emailInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") joinWaitlist();
      });
    </script>
  </body>
</html>
